version: '3.9'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
    env_file:
      - .env.local
    depends_on:
      - redis
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/api/health']
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis for rate limiting (optional - uses in-memory fallback)
  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    restart: unless-stopped
    command: redis-server --appendonly yes
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 3

  # Background worker for scheduled jobs
  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    command: node scripts/worker.js
    env_file:
      - .env.local
    depends_on:
      - redis
    restart: unless-stopped
    profiles:
      - worker

volumes:
  redis_data:
